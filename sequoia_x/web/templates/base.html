<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sequoia-X{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/custom.css?v=20260708g" rel="stylesheet">
</head>
<body>
    <!-- 星空Canvas动效背景 -->
    <canvas id="sx-starfield"></canvas>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-stars"></i> Sequoia-X
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/market"><i class="bi bi-clipboard-data"></i> 大盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auction"><i class="bi bi-alarm"></i> 竞价</a></li>
                    <li class="nav-item"><a class="nav-link" href="/intraday"><i class="bi bi-lightning-charge"></i> 盘中</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stock-analysis"><i class="bi bi-graph-up"></i> 个股</a></li>
                    <li class="nav-item"><a class="nav-link" href="/decision"><i class="bi bi-list-check"></i> 决策</a></li>
                    <li class="nav-item"><a class="nav-link" href="/positions"><i class="bi bi-bag-check"></i> 持仓</a></li>
                    <li class="nav-item"><a class="nav-link" href="/paper"><i class="bi bi-cash-coin"></i> 模拟盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/portfolio"><i class="bi bi-clipboard-check"></i> 体检</a></li>
                    <li class="nav-item"><a class="nav-link" href="/strategy-compare"><i class="bi bi-bar-chart-steps"></i> 策略</a></li>
                    <li class="nav-item"><a class="nav-link" href="/factor"><i class="bi bi-graph-down-arrow"></i> 因子</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stocks"><i class="bi bi-search"></i> 浏览</a></li>
                    <li class="nav-item"><a class="nav-link" href="/system"><i class="bi bi-hdd-stack"></i> 系统</a></li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link pe-0">
                            <span class="sx-live-dot"></span>
                            <span class="small text-muted" id="sx-clock">--:--:--</span>
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast 通知容器 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>

    <!-- 星空粒子动效 -->
    <script>
    (function() {
        const canvas = document.getElementById('sx-starfield');
        const ctx = canvas.getContext('2d');
        let W, H;
        let stars = [], nebulae = [], shootingStars = [];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;

            // ── 星星：3D透视效果 ──
            const starCount = Math.min(300, Math.floor(W * H / 8000));
            stars = [];
            for (let i = 0; i < starCount; i++) {
                const z = Math.random() * 3 + 0.5;  // 深度层
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    z: z,
                    r: (Math.random() * 1.0 + 0.3) / z,  // 远的星星更小
                    baseAlpha: (Math.random() * 0.4 + 0.3) / z,
                    twinkleSpeed: Math.random() * 0.03 + 0.008,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    vx: (Math.random() - 0.5) * 0.12 / z,
                    vy: (Math.random() - 0.5) * 0.12 / z,
                    color: Math.random() < 0.1
                        ? ['#818cf8', '#22d3ee', '#fbbf24', '#f472b6', '#a5b4fc'][Math.floor(Math.random()*5)]
                        : '#e2e8f0',
                });
            }

            // ── 星云团：大型半透明色块，缓慢漂移旋转 ──
            const nebulaColors = [
                { c1: 'rgba(99, 102, 241, 0.25)', c2: 'rgba(99, 102, 241, 0)' },   // 靛蓝
                { c1: 'rgba(168, 85, 247, 0.22)', c2: 'rgba(168, 85, 247, 0)' },   // 紫色
                { c1: 'rgba(34, 211, 238, 0.20)', c2: 'rgba(34, 211, 238, 0)' },   // 青色
                { c1: 'rgba(251, 146, 60, 0.18)', c2: 'rgba(251, 146, 60, 0)' },   // 橙色
                { c1: 'rgba(236, 72, 153, 0.18)', c2: 'rgba(236, 72, 153, 0)' },   // 粉色
                { c1: 'rgba(59, 130, 246, 0.22)', c2: 'rgba(59, 130, 246, 0)' },   // 蓝色
            ];
            nebulae = [];
            for (let i = 0; i < 6; i++) {
                const colors = nebulaColors[i];
                nebulae.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 250 + 250,
                    vx: (Math.random() - 0.5) * 1.0,
                    vy: (Math.random() - 0.5) * 0.7,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: Math.random() * 0.003 + 0.001,
                    c1: colors.c1,
                    c2: colors.c2,
                });
            }
        }

        let t = 0;

        // 流星生成
        function spawnShootingStar() {
            if (shootingStars.length < 2 && Math.random() < 0.003) {
                const startX = Math.random() * W;
                const startY = Math.random() * H * 0.5;
                const angle = Math.PI * 0.25 + (Math.random() - 0.5) * 0.3;
                shootingStars.push({
                    x: startX, y: startY,
                    vx: Math.cos(angle) * 8,
                    vy: Math.sin(angle) * 8,
                    life: 1.0,
                    trail: [],
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            t += 0.016;

            // ── 1. 星云气体层（screen blend，颜色叠加发光）──
            ctx.globalCompositeOperation = 'screen';
            for (const n of nebulae) {
                n.x += n.vx;
                n.y += n.vy;
                n.pulse += n.pulseSpeed;
                if (n.x < -n.r) n.x = W + n.r;
                if (n.x > W + n.r) n.x = -n.r;
                if (n.y < -n.r) n.y = H + n.r;
                if (n.y > H + n.r) n.y = -n.r;

                const pulseFactor = 0.8 + Math.sin(n.pulse) * 0.2;
                const r = Math.max(1, n.r * pulseFactor);
                const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r);
                grad.addColorStop(0, n.c1);
                grad.addColorStop(1, n.c2);
                ctx.fillStyle = grad;
                ctx.fillRect(n.x - r, n.y - r, r * 2, r * 2);
            }
            ctx.globalCompositeOperation = 'source-over';

            // ── 2. 星星层 ──
            for (const s of stars) {
                s.x += s.vx;
                s.y += s.vy;
                if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
                if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;

                const alpha = s.baseAlpha + Math.sin(t * s.twinkleSpeed * 60 + s.twinkleOffset) * 0.3;
                const a = Math.max(0.05, alpha);
                ctx.beginPath();
                ctx.arc(s.x, s.y, Math.max(0.1, s.r), 0, Math.PI * 2);
                ctx.fillStyle = s.color === '#e2e8f0'
                    ? `rgba(226, 232, 240, ${a})`
                    : s.color + Math.floor(a * 255).toString(16).padStart(2, '0');
                ctx.fill();

                // 大星星光晕
                if (s.r > 0.8) {
                    const glowR = Math.max(1, s.r * 4);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, glowR, 0, Math.PI * 2);
                    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glowR);
                    grad.addColorStop(0, s.color + '15');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // 十字光芒
                    if (s.r > 1) {
                        ctx.strokeStyle = s.color + '08';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(s.x - glowR, s.y);
                        ctx.lineTo(s.x + glowR, s.y);
                        ctx.moveTo(s.x, s.y - glowR);
                        ctx.lineTo(s.x, s.y + glowR);
                        ctx.stroke();
                    }
                }
            }

            // ── 3. 流星层 ──
            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.trail.push({ x: ss.x, y: ss.y });
                if (ss.trail.length > 15) ss.trail.shift();
                ss.x += ss.vx;
                ss.y += ss.vy;
                ss.life -= 0.01;

                // 拖尾
                for (let j = 0; j < ss.trail.length; j++) {
                    const tp = ss.trail[j];
                    const trailAlpha = (j / ss.trail.length) * ss.life * 0.8;
                    ctx.beginPath();
                    ctx.arc(tp.x, tp.y, Math.max(0.5, 2 - j * 0.1), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(226, 232, 240, ${trailAlpha})`;
                    ctx.fill();
                }
                // 流星头
                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${ss.life})`;
                ctx.fill();

                if (ss.life <= 0 || ss.x > W + 50 || ss.y > H + 50) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(draw);
        }

        resize();
        window.addEventListener('resize', resize);
        draw();
    })();

    // 时钟
    function updateClock() {
        const el = document.getElementById('sx-clock');
        if (el) {
            const now = new Date();
            el.textContent = now.toLocaleTimeString('zh-CN', {hour12: false});
        }
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 导航高亮当前页
    (function() {
        const path = location.pathname;
        document.querySelectorAll('.navbar-nav .nav-link').forEach(a => {
            if (a.getAttribute('href') === path) a.classList.add('active');
        });
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
