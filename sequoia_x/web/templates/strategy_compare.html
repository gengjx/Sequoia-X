{% extends "base.html" %}

{% block title %}策略评估对比 - Sequoia-X{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<div class="container-fluid py-3">
    <div class="d-flex align-items-center mb-3">
        <h4 class="mb-0 me-3"><i class="bi bi-bar-chart-steps"></i> 策略评估对比</h4>
        <button class="btn btn-primary btn-sm" onclick="runEval()" id="btn-eval">
            <i class="bi bi-play-fill"></i> 运行评估
        </button>
        <button class="btn btn-success btn-sm" onclick="findOptimal()" id="btn-optimal">
            <i class="bi bi-stars"></i> 搜索最优组合
        </button>
        <button class="btn btn-warning btn-sm" onclick="compareCombos()" id="btn-compare">
            <i class="bi bi-arrow-left-right"></i> 预设 vs 最优对比
        </button>
        <span class="text-muted small ms-3" id="eval-meta"></span>
    </div>

    <div class="alert alert-info small mb-3">
        <i class="bi bi-info-circle"></i>
        <strong>方法论：</strong>对每个策略生成月度等权组合净值曲线（信号触发→持20天→扣A股往返成本0.19%/笔），
        计算<strong>年化收益、最大回撤、夏普、卡玛比率、月胜率、盈亏比、超额收益</strong>。
        基准=全市场等权月度收益。净值曲线叠加图可直观对比策略强弱，新策略上线后一目了然。
    </div>

    <div id="compare-result" class="mb-4"></div>
    <div id="optimal-result" class="mb-4"></div>

    <div id="eval-result">
        <div class="text-center text-muted py-5">
            <i class="bi bi-bar-chart-steps" style="font-size:3rem;opacity:0.3"></i>
            <p class="mt-3">点击「运行评估」开始策略回测，或「搜索最优组合」让数据自己说话</p>
        </div>
    </div>
</div>

<script>
async function runEval() {
    const btn = document.getElementById('btn-eval');
    btn.disabled = true;
    const el = document.getElementById('eval-result');
    el.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-3 mb-0">策略评估中（采样500只×8策略×30个月，约3-5秒）...</p></div>';
    try {
        const data = await api('/api/strategy/evaluate');
        renderEval(data);
    } catch(e) {
        el.innerHTML = `<div class="alert alert-danger">评估失败：${e.message}</div>`;
    } finally {
        btn.disabled = false;
    }
}

function fmt(v, suffix='%') {
    if (v === null || v === undefined) return '-';
    const sign = v > 0 ? '+' : '';
    return sign + v.toFixed(2) + suffix;
}

function cellClass(v, positiveBad=false) {
    // positiveBad=true: 正值为红(危险)，负值为绿(好) → 用于回撤
    // positiveBad=false: 正值为绿(好)，负值为红(差) → 用于收益/夏普
    if (positiveBad) {
        return v < -30 ? 'text-danger fw-bold' : v < -10 ? 'text-warning' : 'text-success';
    }
    return v > 0 ? 'text-success fw-bold' : v < -5 ? 'text-danger fw-bold' : 'text-warning';
}

function renderEval(data) {
    const strategies = data.strategies || [];
    const months = data.months || [];
    const bench = data.benchmark || {};
    document.getElementById('eval-meta').textContent =
        `采样${data.sample_size}只 · ${months[0]}~${months[-1]}(${months.length}月) · 扣成本${data.round_trip_cost_pct}%/笔`;

    let html = '';

    // 1. 评分卡对比表
    html += '<div class="card mb-4"><div class="card-header fw-bold"><i class="bi bi-table"></i> 策略评分卡（按夏普降序）</div>';
    html += '<div class="card-body p-0"><div class="table-responsive"><table class="table table-sm table-hover mb-0 align-middle">';
    html += '<thead class="table-dark"><tr><th>策略</th><th>质量分</th><th>年化收益</th><th>最大回撤</th><th>夏普</th><th>卡玛</th><th>月胜率</th><th>盈亏比</th><th>超额(vs基准)</th><th>样本</th></tr></thead><tbody>';

    // 基准行
    html += `<tr class="table-secondary"><td><i class="bi bi-flag"></i> <strong>全市场基准</strong></td>`;
    html += `<td class="${cellClass(bench.annual_return)}">${fmt(bench.annual_return)}</td>`;
    html += `<td class="${cellClass(bench.max_drawdown, true)}">${fmt(bench.max_drawdown)}</td>`;
    html += `<td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>`;

    strategies.forEach((s, i) => {
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        const qs = s.quality_score || 0;
        const qt = qs>=80?'<span class="badge bg-success">S</span>':qs>=65?'<span class="badge bg-info">A</span>':qs>=45?'<span class="badge bg-primary">B</span>':qs>=30?'<span class="badge bg-secondary">C</span>':'<span class="badge bg-danger">D</span>';
        html += `<tr><td>${medal} <strong>${s.label}</strong></td>`;
        html += `<td class="fw-bold">${qs} ${qt}</td>`;
        html += `<td class="${cellClass(s.annual_return)}">${fmt(s.annual_return)}</td>`;
        html += `<td class="${cellClass(s.max_drawdown, true)}">${fmt(s.max_drawdown)}</td>`;
        html += `<td class="${cellClass(s.sharpe)}">${s.sharpe.toFixed(2)}</td>`;
        html += `<td class="${cellClass(s.calmar)}">${s.calmar.toFixed(2)}</td>`;
        html += `<td>${s.win_rate.toFixed(0)}%</td>`;
        html += `<td class="${s.profit_loss_ratio>=1?'text-success':'text-warning'}">${s.profit_loss_ratio.toFixed(2)}</td>`;
        html += `<td class="${cellClass(s.alpha)}">${fmt(s.alpha)}</td>`;
        html += `<td class="text-muted">${s.sample_trades}</td></tr>`;
    });
    html += '</tbody></table></div></div></div>';

    // 2. 净值曲线叠加图
    html += '<div class="card mb-4"><div class="card-header fw-bold"><i class="bi bi-graph-up"></i> 净值曲线对比（起点=1.0，扣成本后）</div>';
    html += '<div class="card-body"><canvas id="curveChart" height="100"></canvas></div></div>';

    // 3. 关键结论
    if (strategies.length > 0) {
        const best = strategies[0];
        const worst = strategies[strategies.length - 1];
        const beatBench = strategies.filter(s => s.alpha > 0);
        const col = best.alpha > 0 ? 'success' : 'warning';
        html += `<div class="alert alert-${col}"><i class="bi bi-lightbulb"></i> <strong>评估结论：</strong>`;
        html += `最优策略 <strong>${best.label}</strong>（年化${best.annual_return}%，夏普${best.sharpe}，回撤${best.max_drawdown}%）`;
        html += `；最差 <strong>${worst.label}</strong>（年化${worst.annual_return}%）`;
        html += `；基准年化${bench.annual_return}%`;
        if (beatBench.length > 0) {
            html += `。<strong class="text-success">${beatBench.length}个策略跑赢基准</strong>：${beatBench.map(s=>s.label).join('、')}`;
        } else {
            html += `。<strong class="text-danger">无策略跑赢基准</strong>——选股alpha不足，需优化策略或降低换手。`;
        }
        html += '</div>';

        html += `<div class="alert alert-success small"><i class="bi bi-check-circle"></i> 策略质量权重已自动刷新写入数据库，<strong>决策中枢将使用最新权重定级</strong>（下次决策生效）。</div>`;
    }

    document.getElementById('eval-result').innerHTML = html;

    // 绘制净值曲线
    drawCurve(strategies, bench, months);
}

function drawCurve(strategies, bench, months) {
    const ctx = document.getElementById('curveChart');
    if (!ctx) return;

    const colors = ['#dc3545','#198754','#0d6efd','#fd7e14','#6610f2','#20c997','#d63384','#ffc107'];

    const datasets = [];
    // 基准线（灰色虚线）
    datasets.push({
        label: '全市场基准',
        data: bench.curve,
        borderColor: '#6c757d',
        borderWidth: 2,
        borderDash: [5, 5],
        pointRadius: 0,
        tension: 0.3,
    });
    // 各策略
    strategies.forEach((s, i) => {
        datasets.push({
            label: s.label,
            data: s.curve,
            borderColor: colors[i % colors.length],
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
        });
    });

    if (window._curveChart) window._curveChart.destroy();
    window._curveChart = new Chart(ctx, {
        type: 'line',
        data: { labels: months, datasets: datasets },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
                tooltip: { mode: 'index', intersect: false },
            },
            scales: {
                y: {
                    title: { display: true, text: '累计净值' },
                    ticks: { callback: v => v.toFixed(2) },
                },
                x: {
                    ticks: { maxTicksLimit: 12, font: { size: 10 } },
                },
            },
            interaction: { mode: 'index', intersect: false },
        },
    });
}

async function compareCombos() {
    const btn = document.getElementById('btn-compare');
    btn.disabled = true;
    const el = document.getElementById('compare-result');
    el.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-warning"></div><p class="mt-3 mb-0">对比评估中（主观预设 vs 数据最优，同一体系，约5-10秒）...</p></div>';
    try {
        const data = await api('/api/strategy/compare-combos');
        renderCompare(data);
    } catch(e) {
        el.innerHTML = `<div class="alert alert-danger">对比失败：${e.message}</div>`;
    } finally {
        btn.disabled = false;
    }
}

function renderCompare(data) {
    const presets = data.presets || [];
    const optimal = data.optimal || [];
    const el = document.getElementById('compare-result');

    let html = '<div class="card border-warning"><div class="card-header fw-bold text-warning"><i class="bi bi-arrow-left-right"></i> 主观预设 vs 数据驱动最优（同一时间序列评估 · 基准年化' + data.benchmark_annual + '% · 采样' + data.sample_size + '只）</div>';
    html += '<div class="card-body">';
    html += '<div class="alert alert-light border small mb-3"><i class="bi bi-info-circle"></i> 把<strong>5个主观预设组合</strong>和<strong>数据搜索的最优组合</strong>放进同一把尺子（月度净值×卡玛排序），客观对比孰优孰劣。<strong>卡玛=年化/|最大回撤|</strong>，越高越好；超额>0表示跑赢全市场基准。</div>';

    html += '<div class="table-responsive"><table class="table table-sm table-hover mb-0 align-middle">';
    html += '<thead><tr class="table-light"><th>来源</th><th>组合</th><th>年化</th><th>最大回撤</th><th>夏普</th><th>卡玛</th><th>超额</th></tr></thead><tbody>';

    // 主观预设(灰色标记)
    presets.forEach(c => {
        const aCls = c.annual_return >= 0 ? 'text-success' : 'text-danger';
        const ddCls = c.max_drawdown < -25 ? 'text-danger' : 'text-warning';
        const aBadge = c.alpha > 0 ? 'text-success' : 'text-danger';
        html += `<tr class="table-light"><td><span class="badge bg-secondary">主观</span></td>`;
        html += `<td class="fw-bold">${c.name}<br><small class="text-muted">${c.labels.join('+')}</small></td>`;
        html += `<td class="${aCls} fw-bold">${c.annual_return>0?'+':''}${c.annual_return}%</td>`;
        html += `<td class="${ddCls}">${c.max_drawdown}%</td>`;
        html += `<td>${c.sharpe}</td><td>${c.calmar}</td>`;
        html += `<td class="${aBadge}">${c.alpha>0?'+':''}${c.alpha}%</td></tr>`;
    });
    // 分隔线
    html += '<tr class="table-warning"><td colspan="7" class="text-center fw-bold text-warning small py-1">↑ 主观预设 ↑ 　 ↓ 数据驱动最优 ↓</td></tr>';
    // 数据最优(绿色标记)
    optimal.forEach(c => {
        const aCls = c.annual_return >= 0 ? 'text-success' : 'text-danger';
        const ddCls = c.max_drawdown < -25 ? 'text-danger' : 'text-warning';
        const aBadge = c.alpha > 0 ? 'text-success' : 'text-danger';
        html += `<tr class="table-success"><td><span class="badge bg-success">数据</span></td>`;
        html += `<td class="fw-bold">${c.name}<br><small class="text-muted">${c.labels.join('+')}</small></td>`;
        html += `<td class="${aCls} fw-bold">${c.annual_return>0?'+':''}${c.annual_return}%</td>`;
        html += `<td class="${ddCls}">${c.max_drawdown}%</td>`;
        html += `<td>${c.sharpe}</td><td class="fw-bold">${c.calmar}</td>`;
        html += `<td class="${aBadge}">${c.alpha>0?'+':''}${c.alpha}%</td></tr>`;
    });
    // 基准行
    html += `<tr class="table-secondary"><td><span class="badge bg-dark">基准</span></td><td class="fw-bold">全市场等权</td><td class="fw-bold">${data.benchmark_annual}%</td><td>-</td><td>-</td><td>-</td><td>—</td></tr>`;
    html += '</tbody></table></div>';

    // 净值曲线对比(主观最差vs数据最优vs基准)
    const worst = presets.reduce((a,b) => a.calmar < b.calmar ? a : b, presets[0]);
    const best = optimal[0];
    if (best && worst) {
        html += '<div class="mt-3"><div class="fw-bold small text-secondary mb-1"><i class="bi bi-graph-up"></i> 净值曲线：最差预设(' + worst.name + ') vs 最优数据 vs 基准</div>';
        html += '<canvas id="compareCurve" height="80"></canvas></div>';
    }

    // 结论
    const bestPreset = presets.reduce((a,b) => a.calmar > b.calmar ? a : b, presets[0]||{calmar:0,name:'-'});
    html += `<div class="alert alert-warning small mt-3 mb-0"><i class="bi bi-lightbulb"></i> <strong>对比结论：</strong>数据最优组合卡玛 <strong>${best.calmar}</strong>，最优主观预设(${bestPreset.name})仅 <strong>${bestPreset.calmar}</strong>，提升 <strong>${(best.calmar - bestPreset.calmar).toFixed(2)}</strong>。`;
    const allPresetNegative = presets.every(p => p.alpha < 0);
    if (allPresetNegative) {
        html += ` <strong class="text-danger">5个主观预设全部跑输基准</strong>（超额${Math.max(...presets.map(p=>p.alpha))}%），建议用数据驱动组合替代。`;
    }
    html += '</div>';

    html += '</div></div>';
    el.innerHTML = html;

    // 画对比曲线
    if (best && worst) {
        const ctx = document.getElementById('compareCurve');
        if (ctx) {
            const datasets = [
                {label: '基准', data: data.benchmark_curve, borderColor: '#6c757d', borderWidth: 2, borderDash: [5,5], pointRadius: 0, tension: 0.3},
                {label: '数据最优('+best.labels.join('+')+')', data: best.curve, borderColor: '#198754', borderWidth: 2.5, pointRadius: 0, tension: 0.3},
                {label: '最差预设('+worst.name+')', data: worst.curve, borderColor: '#dc3545', borderWidth: 2, pointRadius: 0, tension: 0.3},
            ];
            if (window._compareChart) window._compareChart.destroy();
            window._compareChart = new Chart(ctx, {
                type: 'line',
                data: {labels: data.months, datasets},
                options: {
                    responsive: true,
                    plugins: {legend: {position: 'bottom', labels: {boxWidth: 12, font: {size: 11}}}},
                    scales: {
                        y: {title: {display: true, text: '累计净值'}, ticks: {callback: v=>v.toFixed(2)}},
                        x: {ticks: {maxTicksLimit: 12, font: {size: 10}}},
                    },
                },
            });
        }
    }
}

async function findOptimal() {
    const btn = document.getElementById('btn-optimal');
    btn.disabled = true;
    const el = document.getElementById('optimal-result');
    el.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-success"></div><p class="mt-3 mb-0">网格搜索最优组合中（遍历全部策略子集，约5-10秒）...</p></div>';
    try {
        const data = await api('/api/strategy/optimal-combos');
        renderOptimal(data);
    } catch(e) {
        el.innerHTML = `<div class="alert alert-danger">搜索失败：${e.message}</div>`;
    } finally {
        btn.disabled = false;
    }
}

function renderOptimal(data) {
    const combos = data.combos || [];
    const el = document.getElementById('optimal-result');
    if (!combos.length) {
        el.innerHTML = '<div class="alert alert-warning">无有效组合</div>';
        return;
    }

    let html = '<div class="card border-success"><div class="card-header fw-bold text-success"><i class="bi bi-stars"></i> 数据驱动最优组合（网格搜索' + data.total_searched + '种 · 按卡玛排序 · 采样' + data.sample_size + '只）</div>';
    html += '<div class="card-body">';
    html += '<div class="alert alert-light border small mb-3"><i class="bi bi-lightbulb"></i> 系统遍历全部策略子集，按<strong>卡玛比率</strong>（年化收益/最大回撤）排序——兼顾收益与抗风险，比纯年化更实战。基准年化' + data.benchmark_annual + '%。</div>';

    // 最优组合表
    html += '<div class="table-responsive"><table class="table table-sm table-hover mb-0 align-middle">';
    html += '<thead class="table-success"><tr><th>排名</th><th>策略组合</th><th>策略数</th><th>年化收益</th><th>最大回撤</th><th>夏普</th><th>卡玛</th><th>胜率</th><th>超额</th><th>操作</th></tr></thead><tbody>';
    combos.forEach((c, i) => {
        const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
        const label = c.labels.join(' + ');
        const alphaCls = c.alpha > 0 ? 'text-success fw-bold' : c.alpha < -10 ? 'text-danger' : 'text-warning';
        const ddCls = c.max_drawdown < -30 ? 'text-danger' : c.max_drawdown < -15 ? 'text-warning' : 'text-success';
        html += `<tr><td>${medal}</td><td class="fw-bold">${label}</td><td>${c.size}</td>`;
        html += `<td class="${c.annual_return>0?'text-success':'text-danger'} fw-bold">${c.annual_return>0?'+':''}${c.annual_return}%</td>`;
        html += `<td class="${ddCls}">${c.max_drawdown}%</td>`;
        html += `<td>${c.sharpe}</td><td class="fw-bold">${c.calmar}</td><td>${c.win_rate}%</td>`;
        html += `<td class="${alphaCls}">${c.alpha>0?'+':''}${c.alpha}%</td>`;
        html += `<td><a href="/decision?strategies=${c.strategies.join(',')}" class="btn btn-primary btn-sm"><i class="bi bi-arrow-right-circle"></i> 去决策</a></td></tr>`;
    });
    html += '</tbody></table></div>';

    // 净值曲线对比（Top3 + 基准）
    if (combos.length >= 1) {
        html += '<div class="mt-3"><div class="fw-bold small text-secondary mb-1"><i class="bi bi-graph-up"></i> Top3组合净值曲线 vs 基准</div>';
        html += '<canvas id="optimalCurve" height="80"></canvas></div>';
    }

    // 结论
    const best = combos[0];
    const beat = combos.filter(c => c.alpha > 0);
    const col = best.alpha > 0 ? 'success' : 'warning';
    html += `<div class="alert alert-${col} small mt-3 mb-0"><i class="bi bi-lightbulb"></i> <strong>数据结论：</strong>最优组合 <strong>${best.labels.join('+')}</strong>（年化${best.annual_return}%，卡玛${best.calmar}，回撤${best.max_drawdown}%）。`;
    if (beat.length > 0) {
        html += ` <strong class="text-success">${beat.length}个组合跑赢基准</strong>。`;
    } else {
        html += ` <strong class="text-danger">无组合跑赢基准（年化${data.benchmark_annual}%）</strong>——当前策略池alpha不足，建议优化单策略或降低换手。`;
    }
    html += '</div>';

    html += '</div></div>';
    el.innerHTML = html;

    // 绘制曲线
    drawOptimalCurve(combos.slice(0, 3), data);
}

function drawOptimalCurve(combos, data) {
    const ctx = document.getElementById('optimalCurve');
    if (!ctx) return;
    const colors = ['#dc3545', '#198754', '#0d6efd'];
    const datasets = [{
        label: '全市场基准',
        data: data.benchmark_curve,
        borderColor: '#6c757d', borderWidth: 2, borderDash: [5, 5],
        pointRadius: 0, tension: 0.3,
    }];
    combos.forEach((c, i) => {
        datasets.push({
            label: c.labels.join('+'),
            data: c.curve,
            borderColor: colors[i % colors.length],
            borderWidth: 2, pointRadius: 0, tension: 0.3,
        });
    });
    if (window._optimalChart) window._optimalChart.destroy();
    window._optimalChart = new Chart(ctx, {
        type: 'line',
        data: { labels: data.months, datasets },
        options: {
            responsive: true,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } },
            scales: {
                y: { title: { display: true, text: '累计净值' }, ticks: { callback: v => v.toFixed(2) } },
                x: { ticks: { maxTicksLimit: 12, font: { size: 10 } } },
            },
            interaction: { mode: 'index', intersect: false },
        },
    });
}
</script>
{% endblock %}
