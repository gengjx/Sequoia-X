{% extends "base.html" %}
{% block title %}交易决策 - Sequoia-X{% endblock %}
{% block content %}
<div class="mb-3">
    <h2 class="mb-1"><i class="bi bi-list-check"></i> 交易决策中枢</h2>
    <p class="text-muted mb-0">勾选策略 → 多策略选股汇总 → 六层评分过滤 → 共振定级 → 仓位分配，输出可执行买卖清单</p>
</div>

<div class="card mb-4">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-7">
                <label class="form-label fw-bold small mb-2">选择策略（多选 = 共振分析）</label>
                <div id="strategy-box" class="d-flex flex-wrap gap-2"></div>
            </div>
            <div class="col-md-2">
                <label class="form-label small">总资金（元）</label>
                <input type="number" class="form-control" id="capital" value="100000" step="10000">
            </div>
            <div class="col-md-2">
                <label class="form-label small">最低评分</label>
                <input type="number" class="form-control" id="min-score" value="50" min="0" max="100">
            </div>
            <div class="col-md-2">
                <label class="form-label small">分析池上限</label>
                <select class="form-select form-select-sm" id="max-candidates">
                    <option value="40">40只（快）</option>
                    <option value="60" selected>60只（默认）</option>
                    <option value="100">100只（全面）</option>
                    <option value="300">不限（全分析）</option>
                </select>
            </div>
            <div class="col-md-1">
                <button class="btn btn-primary w-100" onclick="generateDecision()"><i class="bi bi-magic"></i></button>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-8">
                <label class="form-label small fw-bold mb-1"><i class="bi bi-funnel"></i> 剔除市场板块（勾选=不选这些板块的股票）</label>
                <div class="d-flex gap-3 flex-wrap">
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="ex-chinext" value="chinext"><label class="form-check-label small" for="ex-chinext">创业板(300)</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="ex-star" value="star"><label class="form-check-label small" for="ex-star">科创板(688)</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="ex-bse" value="bse"><label class="form-check-label small" for="ex-bse">北交所(8/4)</label></div>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="ex-st" value="st"><label class="form-check-label small" for="ex-st">ST/*ST股</label></div>
                    <button class="btn btn-link btn-sm p-0" onclick="document.querySelectorAll('[id^=ex-]').forEach(c=>c.checked=true)">全剔除</button>
                    <button class="btn btn-link btn-sm p-0" onclick="document.querySelectorAll('[id^=ex-]').forEach(c=>c.checked=false)">恢复</button>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <label class="form-label fw-bold small mb-2">⚡ 快速组合（点击自动勾选策略+推荐评分）</label>
            <div id="combo-box" class="row g-2"></div>
            <div class="mt-2 d-flex gap-2 flex-wrap">
                <button class="btn btn-outline-secondary btn-sm" onclick="selectAll(true)">全选策略</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="selectAll(false)">清空</button>
                <button class="btn btn-outline-info btn-sm" onclick="backtestCombos()"><i class="bi bi-graph-up-arrow"></i> 组合对比</button>
                <button class="btn btn-outline-warning btn-sm" onclick="backtestResonance()"><i class="bi bi-diagram-2"></i> 共振分档</button>
                <button class="btn btn-outline-success btn-sm" onclick="pushFeishu()"><i class="bi bi-send"></i> 推送飞书</button>
            </div>
        </div>
    </div>

<div id="backtest-result"></div>
</div>

<div id="combo-tip" class="alert alert-light border d-none mb-3 small">
    <i class="bi bi-lightbulb"></i> <span id="combo-tip-text"></span>
</div>

<div id="loading" class="text-center py-4" style="display:none;">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2" id="loading-text">正在运行策略并生成决策...</p>
</div>

<div id="result"></div>
{% endblock %}

{% block scripts %}
<script>
const STRATEGIES = [
    {key:'ma_volume', name:'均线放量', type:'突破'},
    {key:'turtle', name:'海龟突破', type:'突破'},
    {key:'rps', name:'RPS强势', type:'突破'},
    {key:'flag', name:'高位旗形', type:'强势'},
    {key:'dragon', name:'板块龙头', type:'强势'},
    {key:'pullback', name:'缩量回踩', type:'低吸'},
    {key:'bottom', name:'底部放量', type:'低吸'},
    {key:'shakeout', name:'涨停洗盘', type:'特殊'},
    {key:'limit_down', name:'上升趋势跌停', type:'特殊'},
];
const TYPE_COLORS = {'突破':'primary','强势':'danger','低吸':'success','特殊':'warning'};

function initStrategies() {
    const box = document.getElementById('strategy-box');
    box.innerHTML = STRATEGIES.map(s => `
        <div class="form-check form-check-inline bg-light rounded px-2 py-1">
            <input class="form-check-input strat-cb" type="checkbox" value="${s.key}" id="cb-${s.key}" checked>
            <label class="form-check-label small" for="cb-${s.key}">${s.name} <span class="badge bg-${TYPE_COLORS[s.type]}">${s.type}</span></label>
        </div>`).join('');
}

function selectAll(checked) { document.querySelectorAll('.strat-cb').forEach(cb => cb.checked = checked); }

// 5种实战组合（基于策略互补性+实测数据设计）
const COMBOS = [
    {id:'breakout', icon:'🚀', name:'趋势突破', color:'primary',
     strategies:['turtle','ma_volume','rps'], minScore:60,
     market:'牛市/结构性行情主线，右侧追涨',
     logic:'三者都是趋势启动信号，实测共振45只，共振确认度高，弹性最大'},
    {id:'leader', icon:'🐉', name:'主线龙头', color:'danger',
     strategies:['dragon','rps','turtle'], minScore:55,
     market:'主线明确的行情，龙头接力战法',
     logic:'板块龙头+RPS强势+突破三重验证，聚焦各板块最强标的'},
    {id:'lowbuy', icon:'🛡️', name:'低吸埋伏', color:'success',
     strategies:['pullback','bottom','limit_down'], minScore:45,
     market:'震荡市/调整后布局，防守反击',
     logic:'回踩+反转+恐慌跌停都是低位入场，评分天然偏低故门槛降至45'},
    {id:'balanced', icon:'⚖️', name:'均衡全天候', color:'info',
     strategies:['rps','dragon','turtle','pullback','bottom'], minScore:55,
     market:'不确定市场环境，攻守兼备',
     logic:'突破+龙头+低吸多风格覆盖，适应不同市场阶段'},
    {id:'elite', icon:'💎', name:'高共振精选', color:'warning',
     strategies:['turtle','ma_volume','rps','dragon','pullback','bottom','flag','shakeout','limit_down'], minScore:65,
     market:'少而精，只买多维共振的最确定标的',
     logic:'全策略扫描，依靠共振度≥3筛选极品，要求高评分'},
];

function initCombos() {
    document.getElementById('combo-box').innerHTML = COMBOS.map(c => `
        <div class="col" style="flex:0 0 20%;max-width:20%">
            <div class="card h-100 combo-card border-${c.color}" style="cursor:pointer" onclick="applyCombo('${c.id}')">
                <div class="card-body p-2 text-center">
                    <div class="fs-4">${c.icon}</div>
                    <div class="fw-bold small">${c.name}</div>
                    <div class="text-muted" style="font-size:0.7rem">推荐评分 ≥${c.minScore}</div>
                </div>
            </div>
        </div>`).join('');
}

function applyCombo(id) {
    const c = COMBOS.find(x => x.id === id);
    if (!c) return;
    document.querySelectorAll('.strat-cb').forEach(cb => cb.checked = c.strategies.includes(cb.value));
    document.getElementById('min-score').value = c.minScore;
    // 高亮选中卡片
    document.querySelectorAll('.combo-card').forEach(card => card.classList.remove('border-primary','border-3'));
    event.currentTarget.classList.add('border-3');
    // 显示说明
    const tip = document.getElementById('combo-tip');
    tip.classList.remove('d-none');
    document.getElementById('combo-tip-text').innerHTML =
        `<strong>${c.icon} ${c.name}</strong> · ${c.strategies.length}个策略 · 推荐≥${c.minScore}分<br>` +
        `<span class="text-muted">适用：${c.market}</span><br>` +
        `<span class="text-muted">逻辑：${c.logic}</span>`;
}

async function backtestResonance() {
    const el = document.getElementById('backtest-result');
    el.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-warning"></div> 共振分档回测中（约8秒）...</div>';
    try {
        const data = await api('/api/decision/backtest-resonance');
        renderResonance(data);
    } catch(e) { el.innerHTML = `<div class="alert alert-danger">回测失败：${e.message}</div>`; }
}

function renderResonance(data) {
    const items = data.resonance || [];
    const bands = {};
    items.forEach(c => { (bands[c.resonance] = bands[c.resonance] || []).push(c); });
    const holdDays = [...new Set(items.map(c=>c.hold_days))].sort((a,b)=>a-b);
    const bandOrder = ['1','2','3+'];
    const rtc = data.round_trip_cost_pct || 0.19;

    let html = '<div class="card mb-4 border-warning"><div class="card-header fw-bold text-warning"><i class="bi bi-diagram-2"></i> 共振度分档回测（采样'+data.sample_size+'只 · 扣成本'+rtc+'%/笔）</div><div class="card-body">';
    html += '<div class="alert alert-light border small mb-3"><i class="bi bi-lightbulb"></i> 验证决策中枢核心假设：<strong>多策略共振是否真能带来超额收益？</strong> 净收益已扣A股往返交易成本。</div>';

    const main10 = bandOrder.map(b => bands[b]?.find(i=>i.hold_days===10)).filter(Boolean);
    const maxRet = Math.max(...main10.map(c=>Math.abs(c.avg_return)), 1);
    html += '<div class="mb-3">';
    main10.forEach(c => {
        const w = Math.abs(c.avg_return)/maxRet*100;
        const pos = c.avg_return >= 0;
        const label = c.resonance==='1'?'单策略':c.resonance==='2'?'2策略共振':'3+共振';
        html += `<div class="d-flex align-items-center mb-1" style="font-size:0.85rem">
            <span style="width:90px" class="text-end me-2">${label}</span>
            <div class="flex-grow-1 bg-light rounded" style="height:22px;position:relative">
                <div class="rounded d-flex align-items-center justify-content-end ${pos?'bg-danger':'bg-success'}" style="width:${Math.max(w,5)}%;height:22px">
                    <span class="text-white small px-1">净${c.avg_return>=0?'+':''}${c.avg_return}%</span>
                </div>
            </div>
            <span class="ms-2 text-muted" style="width:75px" title="毛收益">毛${c.gross_return}%</span>
            <span class="text-muted" style="width:55px">胜率${c.win_rate}%</span>
        </div>`;
    });
    html += '</div>';

    html += '<div class="table-responsive"><table class="table table-sm table-hover small mb-0"><thead class="table-light"><tr><th>共振度</th>';
    holdDays.forEach(h => html += `<th>${h}天净收益</th><th>毛收益</th><th>成本</th><th>胜率</th><th>样本</th>`);
    html += '</tr></thead><tbody>';
    bandOrder.forEach(b => {
        if (!bands[b]) return;
        const label = b==='1'?'单策略（共振1）':b==='2'?'2策略共振':'3+策略共振';
        html += `<tr><td class="fw-bold">${label}</td>`;
        holdDays.forEach(h => {
            const it = bands[b].find(i=>i.hold_days===h) || {};
            const cls = (it.avg_return||0)>=0?'text-danger':'text-success';
            html += `<td class="${cls} fw-bold">${(it.avg_return||0)>=0?'+':''}${it.avg_return||0}%</td><td class="text-muted">${it.gross_return||0}%</td><td class="text-warning">${it.cost_drag||0}%</td><td>${it.win_rate||0}%</td><td class="text-muted">${it.count||0}</td>`;
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';

    if (data.resonance_ic && data.resonance_ic.length) {
        const ic10 = data.resonance_ic.find(i=>i.hold_days===10) || data.resonance_ic[0];
        const mono = data.monotonic_10d;
        const col = ic10.ic_mean > 0.02 ? 'success' : (ic10.ic_mean < -0.02 ? 'danger' : 'secondary');
        html += `<div class="alert alert-${col} small mt-2 mb-1"><i class="bi bi-activity"></i> <strong>共振度因子IC（10日）= ${ic10.ic_mean}</strong>（n=${ic10.n}，${ic10.assessment}）。单调性：<strong>${mono?'成立（共振越多收益越高）':'不成立（高共振≠高收益，警惕过热见顶）'}</strong>。</div>`;
    }

    html += '<div class="alert alert-warning small mt-1 mb-0"><i class="bi bi-exclamation-triangle"></i> <strong>关键发现：</strong>若3+共振收益转负/胜率下降，说明多重信号共振在A股常为过热见顶信号（非越共振越好），决策定级需警惕"共振陷阱"。基于历史回测，不代表未来。</div>';
    html += '</div></div>';
    document.getElementById('backtest-result').innerHTML = html;
}

async function backtestCombos() {
    const el = document.getElementById('backtest-result');
    el.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-info"></div> 回测中（采样500只×3持有期，约2秒）...</div>';
    try {
        const data = await api('/api/decision/backtest');
        renderBacktest(data);
    } catch(e) { el.innerHTML = `<div class="alert alert-danger">回测失败：${e.message}</div>`; }
}

function renderBacktest(data) {
    const combos = data.combos || [];
    const groups = {};
    combos.forEach(c => { (groups[c.combo] = groups[c.combo] || []).push(c); });
    const holdDays = [...new Set(combos.map(c=>c.hold_days))].sort((a,b)=>a-b);
    const names = Object.keys(groups);
    const rtc = data.round_trip_cost_pct || 0.19;
    const maxRet = Math.max(...combos.map(c=>Math.abs(c.avg_return)), 1);

    let html = '<div class="card mb-4 border-info"><div class="card-header fw-bold text-info"><i class="bi bi-graph-up-arrow"></i> 组合历史回测对比（采样'+data.sample_size+'只 · 扣成本'+rtc+'%/笔）</div><div class="card-body">';
    html += '<div class="mb-3">';
    names.forEach(name => {
        const items = groups[name];
        const main = items.find(i=>i.hold_days===10) || items[0];
        const w = Math.abs(main.avg_return) / maxRet * 100;
        const pos = main.avg_return >= 0;
        html += `<div class="d-flex align-items-center mb-1" style="font-size:0.85rem">
            <span style="width:90px" class="text-end me-2">${name}</span>
            <div class="flex-grow-1 bg-light rounded" style="height:18px;position:relative">
                <div class="rounded ${pos?'bg-danger':'bg-success'}" style="width:${w}%;height:18px"></div>
            </div>
            <span class="ms-2 fw-bold ${pos?'text-danger':'text-success'}" style="width:80px">净${main.avg_return>=0?'+':''}${main.avg_return}%</span>
            <span class="text-muted ms-1" style="width:70px" title="毛收益${main.gross_return}%">毛${main.gross_return}%</span>
        </div>`;
    });
    html += '</div>';
    html += '<div class="table-responsive"><table class="table table-sm table-hover small mb-0"><thead class="table-light"><tr><th>组合</th>';
    holdDays.forEach(h => html += `<th>${h}天净收益</th><th>毛收益</th><th>成本</th><th>胜率</th><th>样本</th>`);
    html += '</tr></thead><tbody>';
    names.forEach(name => {
        html += `<tr><td class="fw-bold">${name}</td>`;
        holdDays.forEach(h => {
            const it = groups[name].find(i=>i.hold_days===h) || {};
            const cls = it.avg_return>=0?'text-danger':'text-success';
            html += `<td class="${cls} fw-bold">${(it.avg_return||0)>=0?'+':''}${it.avg_return||0}%</td><td class="text-muted">${it.gross_return||0}%</td><td class="text-warning">${it.cost_drag||0}%</td><td>${it.win_rate||0}%</td><td class="text-muted">${it.count||0}</td>`;
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';

    if (data.strategy_ic && data.strategy_ic.length) {
        const sic = data.strategy_ic.filter(i=>i.hold_days===10);
        if (sic.length) {
            html += '<div class="mt-3"><div class="fw-bold small text-secondary mb-1"><i class="bi bi-award"></i> 策略独立选股IC（10日持有 · IC>0.02为有效alpha）</div>';
            html += '<table class="table table-sm table-hover small mb-0"><thead class="table-light"><tr><th>策略</th><th>IC</th><th>样本</th><th>评价</th></tr></thead><tbody>';
            sic.sort((a,b)=>b.ic_mean-a.ic_mean).forEach(s => {
                const col = s.ic_mean>0.02?'success':(s.ic_mean<-0.02?'danger':'muted');
                html += `<tr><td class="fw-bold">${s.label}</td><td class="text-${col} fw-bold">${s.ic_mean}</td><td class="text-muted">${s.n}</td><td>${s.assessment}</td></tr>`;
            });
            html += '</tbody></table></div>';
        }
    }

    html += '<p class="text-muted small mt-2 mb-0"><i class="bi bi-info-circle"></i> 净收益=持有期收益扣A股往返成本；毛收益=裸价收益；IC=Spearman秩相关(>0.02有效)。基于历史数据回测，不代表未来收益。</p>';
    html += '</div></div>';
    document.getElementById('backtest-result').innerHTML = html;
}

async function pushFeishu() {
    const keys = [...document.querySelectorAll('.strat-cb:checked')].map(cb => cb.value);
    if (!keys.length) { showToast('请先选择策略', 'error'); return; }
    const capital = parseFloat(document.getElementById('capital').value) || 100000;
    const minScore = parseInt(document.getElementById('min-score').value) || 50;
    const excludeMarkets = [...document.querySelectorAll('[id^=ex-]:checked')].filter(c=>c.value!=='st').map(c=>c.value);
    const excludeSt = document.getElementById('ex-st').checked;
    if (!confirm('推送当前选择的决策到飞书？')) return;
    showToast('推送中...', 'info');
    try {
        const r = await api('/api/decision/push-feishu', {
            method:'POST', body:JSON.stringify({strategy_keys:keys,capital,min_score:minScore,exclude_markets:excludeMarkets,exclude_st:excludeSt,max_candidates:parseInt(document.getElementById('max-candidates').value)})
        });
        showToast(r.success ? `推送成功！${r.buy_count}只买入清单已发送` : '推送失败，请检查飞书配置', r.success?'success':'error');
    } catch(e) { showToast('推送失败：'+e.message, 'error'); }
}

let _decisionRunning = false;  // 防重复提交锁

async function generateDecision() {
    if (_decisionRunning) { showToast('上一个分析还在进行中，请稍候', 'warning'); return; }
    const keys = [...document.querySelectorAll('.strat-cb:checked')].map(cb => cb.value);
    if (!keys.length) { showToast('请至少选择一个策略', 'error'); return; }
    const capital = parseFloat(document.getElementById('capital').value) || 100000;
    const minScore = parseInt(document.getElementById('min-score').value) || 50;
    const excludeMarkets = [...document.querySelectorAll('[id^=ex-]:checked')].filter(c=>c.value!=='st').map(c=>c.value);
    const excludeSt = document.getElementById('ex-st').checked;
    const filterDesc = excludeMarkets.length||excludeSt ? '（剔除:'+[...excludeMarkets,excludeSt?'ST':''].filter(x=>x).join('+')+'）' : '';
    const loading = document.getElementById('loading');
    const result = document.getElementById('result');
    const btn = document.querySelector('button[onclick="generateDecision()"]');
    // 锁定+禁用按钮
    _decisionRunning = true;
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>'; }
    loading.style.display = 'block'; result.innerHTML = '';
    const t0 = Date.now();
    document.getElementById('loading-text').textContent = `正在运行 ${keys.length} 个策略${filterDesc}并分析候选股...（首次较慢，已用 0 秒）`;
    // 进度计时器
    const timer = setInterval(() => {
        const sec = Math.round((Date.now()-t0)/1000);
        document.getElementById('loading-text').textContent = `正在运行 ${keys.length} 个策略${filterDesc}并分析候选股... 已用 ${sec} 秒`;
    }, 1000);
    try {
        const data = await api('/api/decision/generate', {
            method: 'POST', body: JSON.stringify({ strategy_keys: keys, capital, min_score: minScore, exclude_markets: excludeMarkets, exclude_st: excludeSt, max_candidates: parseInt(document.getElementById('max-candidates').value) })
        });
        clearInterval(timer);
        loading.style.display = 'none';
        renderDecision(data);
    } catch (e) {
        clearInterval(timer);
        loading.style.display = 'none';
        result.innerHTML = `<div class="alert alert-danger">决策生成失败：${e.message}</div>`;
    } finally {
        _decisionRunning = false;
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="bi bi-magic"></i>'; }
    }
}

const GRADE_BADGE = {'A':'<span class="badge bg-danger">A·重仓</span>','B':'<span class="badge bg-warning text-dark">B·建仓</span>','C':'<span class="badge bg-info text-dark">C·试探</span>'};
const GRADE_ROW = {'A':'table-danger','B':'table-warning','C':'table-info'};

function renderDecision(data) {
    const sm = data.summary || {};
    const buys = data.buy_list || [];
    const rejects = data.reject_list || [];
    let html = '';

    // 市场状态横幅（择时层）
    const ms = data.market_state || {};
    const msEmoji = {'bull':'🟢','neutral':'🟡','bear':'🔴'}[ms.state]||'⚪';
    const msLabel = {'bull':'偏暖(放宽门槛·满仓)','neutral':'中性(标准门槛·仓位80%)','bear':'偏冷(收紧门槛·仓位50%)'}[ms.state]||'未知';
    if (ms.state) {
        html += `<div class="alert ${ms.state==='bull'?'alert-success':ms.state==='bear'?'alert-danger':'alert-warning'} mb-3 py-2">
            <i class="bi bi-thermometer-half"></i> <strong>${msEmoji} 市场状态：${msLabel}</strong>
            · 大盘评分 ${ms.score||'-'}/100 ${ms.label?('· '+ms.label):''}
            · 仓位系数×${ms.position_scale||0.8}
        </div>`;
    }

    // 策略运行概览
    const srun = data.strategies_run || {};
    const srunStr = Object.entries(srun).map(([k,v]) => {
        const meta = STRATEGIES.find(s=>s.key===k);
        return `${meta?meta.name:k} ${v}只`;
    }).join(' · ');
    html += `<div class="alert alert-light border small mb-3"><i class="bi bi-info-circle"></i> 运行 ${data.strategy_count} 个策略 → 候选池 <strong>${data.pool_size}</strong> 只（${srunStr}）</div>`;

    // 候选池漏斗：截断前后构成对比（动量预筛可视化）
    const pf = data.pool_funnel;
    if (pf && pf.total_before > pf.total_after) {
        const r1b = pf.resonance_before['1']||0, r2b = pf.resonance_before['2']||0, r3b = pf.resonance_before['3']||0;
        const r1a = pf.resonance_after['1']||0, r2a = pf.resonance_after['2']||0;
        html += `<div class="card mb-3 border-start border-4 border-info">
            <div class="card-body py-2">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold small"><i class="bi bi-funnel"></i> 候选池预筛漏斗（动量分位+共振bonus）</span>
                    <span class="badge bg-info">${pf.total_before} → ${pf.total_after} 只（上限${pf.max_candidates}）</span>
                </div>
                <div class="row text-center small g-2">
                    <div class="col-3"><div class="border rounded py-2 ${r3b?'border-danger bg-danger bg-opacity-10':''}">
                        <div class="fw-bold ${r3b?'text-danger':''}">${r3b}</div>
                        <div class="text-muted">3+共振<br><small class="text-danger">❌淘汰(过热见顶)</small></div>
                    </div></div>
                    <div class="col-1 d-flex align-items-center justify-content-center text-muted"><i class="bi bi-arrow-right"></i></div>
                    <div class="col-2"><div class="border rounded py-2 ${r2a?'border-primary':''}">
                        <div class="fw-bold text-primary">${r2b}→${r2a}</div>
                        <div class="text-muted">共振2<br><small>+1.08%/44%</small></div>
                    </div></div>
                    <div class="col-1 d-flex align-items-center justify-content-center text-muted"><i class="bi bi-plus"></i></div>
                    <div class="col-2"><div class="border rounded py-2 ${r1a?'border-success':''}">
                        <div class="fw-bold text-success">${r1b}→${r1a}</div>
                        <div class="text-muted">单策略<br><small class="text-success">+1.22%/47%最优</small></div>
                    </div></div>
                    <div class="col-3 d-flex align-items-center"><div class="text-muted small ps-2">
                        <i class="bi bi-lightbulb text-warning"></i> 让市场动量选票，非纯共振度排序<br>
                        回测最优的单策略高动量票优先入选
                    </div></div>
                </div>
            </div>
        </div>`;
    }

    // 财报预采提示
    const fp = data.finance_prefetch;
    if (fp) {
        if (fp.missing > 0) {
            html += `<div class="alert alert-warning py-2 mb-3 small"><i class="bi bi-database-check"></i>
                <strong>财报批量预采</strong>：缺${fp.missing}只 → 采集${fp.fetched}季 · 已有${fp.skipped}只秒级命中（baostock单次会话集中采集）
            </div>`;
        } else if (fp.skipped > 0) {
            html += `<div class="alert alert-light border py-2 mb-3 small"><i class="bi bi-check-circle text-success"></i>
                财报全部已有（${fp.skipped}只秒级命中库），无需采集
            </div>`;
        }
    }

    // 组合摘要
    html += `
    <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card h-100 text-center border-primary"><div class="card-body">
            <div class="display-6 fw-bold text-primary">${sm.buy_count||0}</div><div class="text-muted small">可买入</div>
            <small>A${(sm.grade_count||{}).A||0} B${(sm.grade_count||{}).B||0} C${(sm.grade_count||{}).C||0}</small>
        </div></div></div>
        <div class="col-md-3"><div class="card h-100 text-center"><div class="card-body">
            <div class="display-6 fw-bold">${sm.reject_count||0}</div><div class="text-muted small">已淘汰</div>
        </div></div></div>
        <div class="col-md-3"><div class="card h-100 text-center"><div class="card-body">
            <div class="display-6 fw-bold text-success">${sm.position_ratio||0}%</div><div class="text-muted small">仓位占用</div>
            <small>现金 ${sm.cash_ratio||0}% · ¥${(sm.used_capital||0).toLocaleString()}</small>
        </div></div></div>
        <div class="col-md-3"><div class="card h-100 text-center ${sm.concentration>=50?'border-warning':''}"><div class="card-body">
            <div class="display-6 fw-bold ${sm.concentration>=50?'text-warning':''}">${sm.concentration||0}%</div><div class="text-muted small">行业集中</div>
            <small>${sm.top_industry||'分散'}</small>
        </div></div></div>
    </div>`;

    // 买入清单
    if (buys.length) {
        html += `
        <div class="card mb-4">
            <div class="card-header fw-bold"><i class="bi bi-cart-plus"></i> 买入清单（按评级排序，点击进个股分析）</div>
            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle mb-0">
                    <thead class="table-light small"><tr>
                        <th>评级</th><th>股票</th><th>共振</th><th>命中策略</th><th>评分</th>
                        <th>现价</th><th>止损</th><th>目标</th><th>仓位</th><th>股数</th><th>资金</th>
                    </tr></thead>
                    <tbody class="small">
                    ${buys.map(r => `
                        <tr class="${GRADE_ROW[r.grade]||''}">
                            <td>${GRADE_BADGE[r.grade]||'-'}</td>
                            <td><a href="/stock-analysis?symbol=${r.symbol}" class="text-decoration-none fw-semibold">${r.name}<br><small class="text-muted">${r.symbol}</small></a></td>
                            <td>${r.resonance>1?`<span class="badge bg-danger">${r.resonance}共振</span>`:r.resonance}</td>
                            <td><small>${r.hit_strategies.map(s=>`<span class="badge bg-light text-dark me-1">${s}</span>`).join('')}</small></td>
                            <td class="fw-bold">${r.score}</td>
                            <td>${r.price!=null?r.price.toFixed(2):'-'}</td>
                            <td class="text-success">${r.stop_loss!=null?r.stop_loss.toFixed(2):'-'}</td>
                            <td class="text-danger">${r.target!=null?r.target.toFixed(2):'-'}</td>
                            <td class="fw-bold">${r.position_pct||0}%</td>
                            <td>${r.shares||0}</td>
                            <td>¥${(r.capital||0).toLocaleString()}</td>
                        </tr>
                        <tr class="${GRADE_ROW[r.grade]||''}"><td colspan="11" class="py-1"><small class="text-muted">💡 ${r.reason}</small></td></tr>
                    `).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    } else {
        html += `<div class="alert alert-warning">当前策略组合无符合买入条件的标的，可降低最低评分或更换策略</div>`;
    }

    // 淘汰清单
    if (rejects.length) {
        html += `
        <div class="card border-secondary">
            <div class="card-header fw-bold text-muted"><i class="bi bi-funnel"></i> 淘汰清单（${rejects.length}只，${rejects.length>5?'前5':''}）</div>
            <div class="table-responsive">
                <table class="table table-sm mb-0">
                    <thead class="table-light small"><tr><th>股票</th><th>共振</th><th>评分</th><th>淘汰原因</th></tr></thead>
                    <tbody class="small">
                    ${rejects.slice(0,5).map(r => `
                        <tr><td>${r.name}（${r.symbol}）</td><td>${r.resonance}</td><td>${r.score}</td><td class="text-muted">${r.reject_reason||'-'}</td></tr>
                    `).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    }

    html += `<p class="text-center text-muted small mt-3 mb-4"><i class="bi bi-shield-exclamation"></i> 量化决策仅供参考，A股T+1，请结合大盘环境与自身风险偏好。仓位基于ATR风险预算（单笔1.5%）。</p>`;
    document.getElementById('result').innerHTML = html;
}

initStrategies();
initCombos();
</script>
{% endblock %}
